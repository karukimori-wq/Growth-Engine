name: Patch Production version race
on:
  push:
    branches:
      - fix/cloudflare-production-version-race
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-production-version-race
      - name: Patch Cloudflare Production verification ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/cloudflare-production.yml')
          text = path.read_text()
          needle = '      - name: Verify public Production endpoints\n        run: |\n          sleep 5\n'
          replacement = '      - name: Finalize Worker deployment after secret configuration\n        run: npx wrangler deploy\n      - name: Verify public Production endpoints\n        run: |\n          for attempt in {1..12}; do\n            if curl --fail --silent --show-error "$PRODUCTION_URL/version" > /tmp/version-ready.json; then\n              if node -e \'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync("/tmp/version-ready.json","utf8"));process.exit(v.commitSha===process.env.GITHUB_SHA?0:1)\'; then\n                echo "Production version converged to $GITHUB_SHA"\n                break\n              fi\n            fi\n            if [ "$attempt" -eq 12 ]; then\n              cat /tmp/version-ready.json 2>/dev/null || true\n              echo "Production version did not converge to $GITHUB_SHA"\n              exit 1\n            fi\n            sleep 5\n          done\n'
          if needle not in text:
              raise SystemExit('Expected Production workflow anchor not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Remove one-shot helper
        run: rm .github/workflows/patch-production-version-race.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cloudflare-production.yml .github/workflows/patch-production-version-race.yml
          git commit -m "Stabilize Cloudflare Production version verification"
          git push origin HEAD:fix/cloudflare-production-version-race
